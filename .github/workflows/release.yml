name: Release Module

on:
  release:
    types: [published]

# Never let two releases upload assets at the same time
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

env:
  MODULE_ID: tidy-ui_game-settings
  TAG: ${{ github.event.release.tag_name }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout tag
        uses: actions/checkout@v7

      - name: Verify version matches tag
        run: |
          MODULE_VERSION="$(jq -r '.version' module.json)"
          if [ "${TAG#v}" != "$MODULE_VERSION" ]; then
            echo "::error::Tag version (${TAG#v}) doesn't match module.json version ($MODULE_VERSION)"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Run tests
        run: |
          npm ci
          npm test

      - name: Set download URL
        run: |
          echo "DOWNLOAD_URL=https://github.com/${{ github.repository }}/releases/download/$TAG/$MODULE_ID.zip" >> "$GITHUB_ENV"

      - name: Build module zip
        run: |
          jq --arg url "$DOWNLOAD_URL" '.download = $url' module.json > module.json.tmp
          mv module.json.tmp module.json

          # Whitelist of runtime files, so dev files never end up in the package
          mkdir -p "dist/$MODULE_ID"
          cp -r module.json src README.md CHANGELOG.md "dist/$MODULE_ID/"
          (cd dist && zip -qr "../$MODULE_ID.zip" "$MODULE_ID")
          unzip -l "$MODULE_ID.zip"

      # module.json on the release is what the manifest URL (releases/latest/download/module.json) serves
      - name: Upload assets to release
        run: gh release upload "$TAG" "$MODULE_ID.zip" module.json --clobber

